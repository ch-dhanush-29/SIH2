version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: burnwatch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnwatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-burnwatch_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - burnwatch_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnwatch_user -d burnwatch_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: burnwatch_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - burnwatch_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: burnwatch_backend
    command: >
      sh -c "alembic upgrade head &&
             python -m backend.app.services.seed_db &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-burnwatch_user}:${POSTGRES_PASSWORD:-secure_production_password}@postgres:5432/${POSTGRES_DB:-burnwatch_prod}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CHAMBER_TARGET_TEMP_C=125.0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend_data:/app/data
    networks:
      - burnwatch_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: burnwatch_worker
    command: python -m backend.app.workers.screening_worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-burnwatch_user}:${POSTGRES_PASSWORD:-secure_production_password}@postgres:5432/${POSTGRES_DB:-burnwatch_prod}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - burnwatch_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: burnwatch_frontend
    ports:
      - "3000:80"
    networks:
      - burnwatch_net
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:

networks:
  burnwatch_net:
    driver: bridge
