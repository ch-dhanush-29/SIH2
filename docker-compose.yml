version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: burnwatch_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./burnwatch.db
      - SECRET_KEY=isro-sih26170-burnwatch-supersecret-jwt-key-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CHAMBER_TARGET_TEMP_C=125.0
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: burnwatch_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
